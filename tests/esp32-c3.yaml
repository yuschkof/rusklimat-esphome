# ESP32-C3 SuperMini / SuperMini Plus — как в README, раздел «Другие платы»
packages:
  example: !include _example.yaml

esphome:
  build_path: .esphome/build/esp32-c3  # своя папка сборки: у всех тестов одинаковое имя устройства

esp32:
  board: esp32-c3-devkitm-1

uart:
  id: ac_uart
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 9600

wifi:
  output_power: 8.5dB
