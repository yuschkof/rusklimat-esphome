# Wemos D1 mini — как в README, раздел «Другие платы»
packages:
  example: !include _example.yaml

esphome:
  build_path: .esphome/build/esp8266  # своя папка сборки: у всех тестов одинаковое имя устройства

esp32: !remove

esp8266:
  board: d1_mini

logger:
  baud_rate: 0

uart:
  id: ac_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
