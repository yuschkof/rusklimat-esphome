# Карточка для дашборда Home Assistant: термостат + доп. функции кондиционера в одном блоке.
# Дашборд → «Изменить» → «Добавить карточку» → «Вручную» → вставить это.
# entity_id — как в HA у пользователя (ионизатор исторически называется switch.konditsioner_rezhim_eko).
type: vertical-stack
cards:
  - type: thermostat
    entity: climate.konditsioner_konditsioner
    features:
      - type: climate-hvac-modes
        hvac_modes: [ "off", cool, heat, dry, fan_only, auto ]
      - type: climate-fan-modes
        style: icons
        fan_modes: [ auto, low, medium, high ]
      - type: climate-swing-modes
        style: dropdown

  # Доп. функции одной строкой: только иконка и подпись, без «Включено/Выключено».
  # Включённая плитка подсвечивается цветом.
  - type: grid
    columns: 5
    square: false
    cards:
      - type: tile
        entity: switch.konditsioner_tikhii_rezhim
        name: Тихий
        vertical: true
        hide_state: true
        tap_action: { action: toggle }
      - type: tile
        entity: switch.konditsioner_turbo
        name: Турбо
        vertical: true
        hide_state: true
        tap_action: { action: toggle }
      - type: tile
        entity: switch.konditsioner_son
        name: Сон
        vertical: true
        hide_state: true
        tap_action: { action: toggle }
      - type: tile
        entity: switch.konditsioner_displei
        name: Дисплей
        vertical: true
        hide_state: true
        tap_action: { action: toggle }
      - type: tile
        entity: switch.konditsioner_rezhim_eko
        name: Ионизатор
        vertical: true
        hide_state: true
        tap_action: { action: toggle }

  - type: tile
    entity: number.konditsioner_taimer_chasy
    name: Таймер
    features:
      - type: numeric-input
        style: slider
