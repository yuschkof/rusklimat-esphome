name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [esp32dev, esp32-c3, esp8266]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install "esphome==2026.9.1"

      - name: Cache PlatformIO / ESP-IDF
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.esphome
          key: ${{ runner.os }}-esphome-2026.9.1-${{ matrix.board }}

      - name: Prepare test config
        run: sh tests/prepare.sh

      - name: Validate
        run: esphome config tests/${{ matrix.board }}.yaml

      - name: Compile
        run: esphome compile tests/${{ matrix.board }}.yaml
