# Скопируйте нужные строки в secrets.yaml рядом с конфигом устройства (в ESPHome Device Builder — кнопка «Secrets»).
wifi_ssid: "MyWiFi"
wifi_password: "wifi-password"

# 32 случайных байта в base64. Сгенерировать: https://esphome.io/components/api/#configuration-variables
# или: python -c "import base64, os; print(base64.b64encode(os.urandom(32)).decode())"
api_encryption_key: "REPLACE_WITH_BASE64_KEY"

ota_password: "ota-password"

# Не короче 8 символов
fallback_ap_password: "fallback-password"
